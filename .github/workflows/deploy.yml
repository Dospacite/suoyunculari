name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_DIRECTUS_URL: ${{ secrets.PUBLIC_DIRECTUS_URL }}
          DATABASE_URL: postgres://suo:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/suoyunculari

      - name: Check
        run: npm run check

      - name: Update Directus schema
        run: |
          if [ -z "$DIRECTUS_TOKEN" ]; then
            echo "::warning title=Directus schema skipped::Add the DIRECTUS_TOKEN repository secret, then rerun this workflow to update the CMS schema."
            exit 0
          fi
          node scripts/setup-directus-schema.mjs
          node scripts/setup-directus-permissions.mjs
        env:
          DIRECTUS_URL: ${{ secrets.PUBLIC_DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}

      - name: Sync app to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "./"
          TARGET: "/opt/suoyunculari/"
          ARGS: "-rlDzvc --delete --chmod=D775,F664"
          EXCLUDE: "/node_modules/, /dist/, /.astro/, /.git/, /scraped/, /.env, /.env.*"

      - name: Restart compose stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/suoyunculari

            existing_value() {
              if sudo test -f .env; then
                sudo sed -n "s/^$1=//p" .env | tail -n 1
              fi
            }

            PUBLIC_DIRECTUS_URL_VALUE='${{ secrets.PUBLIC_DIRECTUS_URL }}'
            POSTGRES_PASSWORD_VALUE='${{ secrets.POSTGRES_PASSWORD }}'
            GEMINI_API_KEY_VALUE='${{ secrets.GEMINI_API_KEY }}'
            DIRECTUS_TOKEN_VALUE='${{ secrets.DIRECTUS_TOKEN }}'

            PUBLIC_DIRECTUS_URL_VALUE="${PUBLIC_DIRECTUS_URL_VALUE:-$(existing_value PUBLIC_DIRECTUS_URL)}"
            POSTGRES_PASSWORD_VALUE="${POSTGRES_PASSWORD_VALUE:-$(existing_value POSTGRES_PASSWORD)}"
            GEMINI_API_KEY_VALUE="${GEMINI_API_KEY_VALUE:-$(existing_value GEMINI_API_KEY)}"
            DIRECTUS_TOKEN_VALUE="${DIRECTUS_TOKEN_VALUE:-$(existing_value DIRECTUS_TOKEN)}"

            tmp_env="$(mktemp)"
            cat > "$tmp_env" <<EOF
            PUBLIC_DIRECTUS_URL=${PUBLIC_DIRECTUS_URL_VALUE:-https://cms.suoyunculari.com}
            POSTGRES_DB=suoyunculari
            POSTGRES_USER=suo
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD_VALUE:-suo_password}
            GEMINI_API_KEY=${GEMINI_API_KEY_VALUE:-}
            DIRECTUS_TOKEN=${DIRECTUS_TOKEN_VALUE:-}
            EOF
            sudo install -m 600 -o "$(id -un)" -g "$(id -gn)" "$tmp_env" .env
            rm -f "$tmp_env"

            docker compose up -d --build --force-recreate app
            docker compose exec -T app npm run db:import:text-bank -- --truncate
            docker image prune -f
