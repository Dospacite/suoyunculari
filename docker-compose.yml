services:
  postgres:
    image: postgres:16-alpine
    container_name: suoyunculari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suoyunculari}
      POSTGRES_USER: ${POSTGRES_USER:-suo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suo_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suo} -d ${POSTGRES_DB:-suoyunculari}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    container_name: suoyunculari-app
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      DATABASE_URL: postgres://${POSTGRES_USER:-suo}:${POSTGRES_PASSWORD:-suo_password}@postgres:5432/${POSTGRES_DB:-suoyunculari}
      PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL:-https://cms.suoyunculari.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "4321:4321"
    networks:
      - default
      - web

volumes:
  postgres_data:

networks:
  web:
    external: true
