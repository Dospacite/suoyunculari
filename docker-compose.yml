services:
  postgres:
    image: postgres:16-alpine
    container_name: suoyunculari-yk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${YK_POSTGRES_DB:-suoyunculari_yk}
      POSTGRES_USER: ${YK_POSTGRES_USER:-suo_yk}
      POSTGRES_PASSWORD: ${YK_POSTGRES_PASSWORD:-suo_yk_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YK_POSTGRES_USER:-suo_yk} -d ${YK_POSTGRES_DB:-suoyunculari_yk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - yk_postgres_data:/var/lib/postgresql/data

  app:
    container_name: suoyunculari-yk-app
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      YK_DATABASE_URL: postgres://${YK_POSTGRES_USER:-suo_yk}:${YK_POSTGRES_PASSWORD:-suo_yk_password}@postgres:5432/${YK_POSTGRES_DB:-suoyunculari_yk}
      YK_SESSION_SECRET: ${YK_SESSION_SECRET:-}
    networks:
      - default
      - web

volumes:
  yk_postgres_data:

networks:
  web:
    external: true
